<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive client-side To-Do List application with CRUD, localStorage persistence, and filtering.">
<meta name="author" content="Avinash">
<title>To-Do List | Avinash</title>
<link rel="stylesheet" href="todo.css">
</head>

<body>

<header role="banner">
  <h1>To-Do List</h1>
  <p>Create, edit, complete, and organize your tasks</p>
</header>

<main id="todo-app">

  <form id="todo-form" aria-label="Add a new task">
    <label class="sr-only" for="todo-input">New task</label>
    <input
      type="text"
      id="todo-input"
      name="todo"
      placeholder="What needs to be done?"
      maxlength="120"
      autocomplete="off"
      required
      aria-required="true"
    >
    <button type="submit" aria-label="Add task">Add</button>
  </form>

  <div id="filters" role="group" aria-label="Filter tasks">
    <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
    <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
    <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
  </div>

  <ul id="todo-list" aria-live="polite"></ul>

  <div id="todo-footer">
    <span id="items-left">0 items left</span>
    <button type="button" id="clear-completed">Clear completed</button>
  </div>

  <p id="empty-state" hidden>No tasks here. Add one above to get started!</p>

</main>

<footer role="contentinfo">
  <p>© 2026 Avinash. All Rights Reserved.</p>
</footer>

<script src="todo.js"></script>
</body>
</html>
